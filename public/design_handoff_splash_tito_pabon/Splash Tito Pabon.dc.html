<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Barlow+Condensed:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#111; }
  a { color:#E4032E; } a:hover { color:#b30224; }
  @keyframes blobDrift { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(18px,-26px,0) scale(1.12); } }
  @keyframes blobDrift2 { 0%,100% { transform: translate3d(0,0,0) scale(1.05); } 50% { transform: translate3d(-24px,20px,0) scale(0.92); } }
  @keyframes logoDrop { 0% { opacity:0; transform: translateY(-70px) scale(.7) rotate(-8deg); } 60% { opacity:1; transform: translateY(6px) scale(1.04) rotate(2deg); } 100% { opacity:1; transform: translateY(0) scale(1) rotate(0deg); } }
  @keyframes slideL { 0% { opacity:0; transform: translateX(-70px) skewX(-22deg); } 100% { opacity:1; transform: translateX(0) skewX(-9deg); } }
  @keyframes slideR { 0% { opacity:0; transform: translateX(70px) skewX(4deg); } 100% { opacity:1; transform: translateX(0) skewX(-9deg); } }
  @keyframes fadeUp { 0% { opacity:0; transform: translateY(18px); } 100% { opacity:1; transform: translateY(0); } }
  @keyframes popArte { 0% { opacity:0; transform: scale(.3) rotate(6deg); } 70% { opacity:1; transform: scale(1.18) rotate(-20deg); } 100% { opacity:1; transform: scale(1) rotate(-16deg); } }
  @keyframes popColor { 0% { opacity:0; transform: scale(.3) rotate(6deg); } 70% { opacity:1; transform: scale(1.18) rotate(-18deg); } 100% { opacity:1; transform: scale(1) rotate(-14deg); } }
  @keyframes cardIn { 0% { opacity:0; transform: translateY(60px) scale(.82); } 65% { opacity:1; transform: translateY(-10px) scale(1.03); } 100% { opacity:1; transform: translateY(0) scale(1); } }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-9px) rotate(.6deg); } }
  @keyframes sheen { 0% { transform: translateX(-140%) rotate(18deg); } 55%,100% { transform: translateX(240%) rotate(18deg); } }
  @keyframes fill { 0% { width:4%; } 100% { width:100%; } }
  @keyframes dropFall { 0% { transform: translateY(-8px) scaleY(.6); opacity:0; } 25% { opacity:1; } 100% { transform: translateY(34px) scaleY(1.25); opacity:0; } }
  @keyframes popIn { 0% { opacity:0; transform: scale(.4); } 70% { opacity:1; transform: scale(1.1); } 100% { opacity:1; transform: scale(1); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @keyframes glowPulse { 0%,100% { opacity:.35; } 50% { opacity:.7; } }
</style>
</helmet>
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0d0d0f; padding:24px; font-family:'Barlow Condensed', sans-serif;">
  <div style="position:relative; width:440px; height:760px; border-radius:34px; overflow:hidden; box-shadow:0 40px 90px rgba(0,0,0,.55); background:radial-gradient(120% 90% at 50% 42%, #FFE79A 0%, #FDD962 45%, #F7C63F 100%);">

    <div style="position:absolute; inset:0; overflow:hidden;">
      <div style="position:absolute; top:-120px; left:-130px; width:290px; height:290px; border-radius:50%; background:radial-gradient(circle at 40% 40%, #EC0C7B, #C2076A); filter:blur(26px); opacity:.85; animation:blobDrift 11s ease-in-out infinite;"></div>
      <div style="position:absolute; top:130px; right:-120px; width:250px; height:250px; border-radius:50%; background:radial-gradient(circle at 45% 45%, #2FC3C9, #17A8B4); filter:blur(30px); opacity:.6; animation:blobDrift2 13s ease-in-out infinite;"></div>
      <div style="position:absolute; bottom:-90px; left:-110px; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle at 50% 40%, #A45BD6, #7C3FB0); filter:blur(34px); opacity:.5; animation:blobDrift 15s ease-in-out infinite;"></div>
      <div style="position:absolute; bottom:60px; right:-70px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle at 50% 40%, #2FC3C9, #1B9AA6); filter:blur(28px); opacity:.45; animation:blobDrift2 12s ease-in-out infinite;"></div>
    </div>

    <div style="position: relative; height: 696px; display: flex; flex-direction: column; align-items: center; padding: 34px 30px 30px; width: 382px">
      <img src="assets/logo.png" alt="Pinturas Tito Pabón" style="width:150px; height:auto; filter:drop-shadow(0 6px 10px rgba(150,90,0,.28)); animation:logoDrop .9s cubic-bezier(.2,1.5,.4,1) both;">

      <div style="margin-top:26px; display:flex; flex-direction:column; align-items:center; gap:2px; font-family:'Anton', sans-serif;">
        <div style="font-size:56px; line-height:.94; letter-spacing:.5px; color:#E4032E; transform:skewX(-9deg); text-shadow:0 3px 0 rgba(255,255,255,.55), 0 10px 22px rgba(196,0,40,.28); animation:slideL .7s cubic-bezier(.2,.9,.2,1) .35s both;">TU ROSTRO,</div>
        <div style="font-size:56px; line-height:.94; letter-spacing:.5px; color:#FFFFFF; transform:skewX(-9deg); text-shadow:0 4px 0 #d8ab2a, 0 12px 26px rgba(120,80,0,.32); animation:slideR .7s cubic-bezier(.2,.9,.2,1) .5s both;">TU ARTE</div>
      </div>

      <div style="margin-top:22px; font-weight:800; font-size:25px; letter-spacing:.6px; color:#2B2118; text-transform:uppercase; text-align:center; animation:fadeUp .6s ease-out .85s both;">Conviértete en una obra de arte</div>

      <div style="position:relative; margin-top:34px; width:262px;">
        
        

        <div style="position:relative; animation:cardIn .85s cubic-bezier(.2,1.3,.35,1) 1.05s both;">
          <div style="position:absolute; inset:-14px; border-radius:40px; background:radial-gradient(circle, rgba(255,255,255,.75), rgba(255,255,255,0) 68%); animation:glowPulse 4s ease-in-out infinite;"></div>
          <div style="position:relative; border-radius:30px; overflow:hidden; box-shadow:0 22px 44px rgba(150,95,0,.3), inset 0 0 0 1px rgba(255,255,255,.45);">
            <img src="assets/mascota.png" alt="Mascota Tito Pabón" style="display:block; width:100%; height:auto; animation:bob 4.2s ease-in-out 1.9s infinite;">
            <div style="position:absolute; top:0; left:0; width:60%; height:130%; background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.5), rgba(255,255,255,0)); animation:sheen 3.6s ease-in-out 2.2s infinite;"></div>
          </div>
        </div>
      </div>

      <div style="margin-top:auto; width:100%; display:flex; flex-direction:column; align-items:center; gap:12px; animation:fadeUp .6s ease-out 1.7s both;">
        <div style="position:relative; width:190px; height:9px; border-radius:99px; background:rgba(120,80,10,.18); overflow:visible;">
          <div style="position:relative; height:100%; border-radius:99px; background:linear-gradient(90deg,#F7A600,#E4032E); animation:fill 2.6s cubic-bezier(.5,.05,.3,1) 1.8s both;">
            <div style="position:absolute; right:-3px; top:6px; width:9px; height:12px; border-radius:0 0 50% 50%; background:#E4032E; animation:dropFall 1.6s ease-in 2.6s infinite;"></div>
          </div>
        </div>
        <button type="button" style="border:none; cursor:pointer; padding:16px 34px; border-radius:99px; background:linear-gradient(180deg,#F2143C,#C40024); color:#fff; font-family:'Anton',sans-serif; font-size:22px; letter-spacing:1.6px; text-transform:uppercase; box-shadow:0 10px 0 #8E0019, 0 18px 30px rgba(140,0,25,.32); animation:popIn .5s cubic-bezier(.2,1.6,.4,1) 2.9s both, pulse 2.4s ease-in-out 3.5s infinite;" style-hover="transform:translateY(-2px); box-shadow:0 12px 0 #8E0019, 0 22px 34px rgba(140,0,25,.36);" style-active="transform:translateY(6px); box-shadow:0 4px 0 #8E0019, 0 10px 18px rgba(140,0,25,.3);">Toca para comenzar</button>
      </div>
    <div style="position: absolute; top: 403px; font-family: 'Anton',sans-serif; font-size: 29px; color: #F0369A; transform: rotate(-14deg); text-shadow: 0 2px 0 rgba(255,255,255,.5); animation: popColor .55s cubic-bezier(.2,1.6,.4,1) 1.4s both; left: 367px">COLOR</div><div style="position: absolute; left: 14px; top: 323px; font-family: 'Anton',sans-serif; font-size: 29px; color: #1FB6C4; transform: rotate(-16deg); text-shadow: 0 2px 0 rgba(255,255,255,.5); animation: popArte .55s cubic-bezier(.2,1.6,.4,1) 1.25s both">ARTE</div></div>
  </div>
</div>

</x-dc>
</body>
</html>
